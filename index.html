
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SallyTech | Premium Laptops & Repairs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
            background-color: #0B1120;
            color: #F8FAFC;
        }
        .text-gradient {
            background: linear-gradient(to right, #818CF8, #2DD4BF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-title {
            letter-spacing: -0.05em;
            line-height: 0.95;
        }
        .inventory-underline {
            height: 3px;
            width: 80px;
            background: linear-gradient(to right, #818CF8, #2DD4BF);
            margin: 1rem auto;
            border-radius: 99px;
        }
        .bg-card {
            background-color: #1A2234;
        }
        .text-cyan-brand {
            color: #2DD4BF;
        }
        .tag-pill {
            background-color: #111827;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 0.7rem;
            font-weight: 500;
            color: #94A3B8;
        }
        .whatsapp-gradient {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        }

        /* Enhanced Image Quality Rendering */
        .image-sharp {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: bicubic;
        }

        /* Marquee Animation */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 40s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* Word Rotation Animation */
        .word-rotator {
            display: inline-block;
            height: 1.15em;
            overflow: hidden;
            vertical-align: bottom;
            position: relative;
        }
        .word-rotator-inner {
            display: block;
            /* 12 seconds total cycle (4s per word) */
            animation: wordRotation 12s cubic-bezier(0.76, 0, 0.24, 1) infinite;
        }
        .word-rotator-inner span {
            display: block;
            height: 1.15em;
            line-height: 1.15;
        }
        
        @keyframes wordRotation {
            0%, 28% { transform: translateY(0); }
            33.33%, 61.33% { transform: translateY(-1.15em); }
            66.66%, 94.66% { transform: translateY(-2.30em); }
            100% { transform: translateY(-3.45em); }
        }
    </style>

}

</head>

</body>
</html>
